[build-system]
requires = [
    "setuptools>=80",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "django-wm"
dynamic = ["version"]
description = "Webmention support for Django."
authors = [
    { name = "Michael Beaton", email = "michael@beatonma.org" }
]
license = { text = "GPLv3" }
readme = "README.md"
classifiers = [
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.6",
    "Django>=2.2",
    "mf2py>=1.1",
    "requests>=2.20",
]

[project.optional-dependencies]
celery = ["celery >= 5.2.2"]
test = ["pytest", "pytest-django"]
wagtail = ["wagtail >= 3.0.3"]

[project.urls]
"Configuration Test Tool" = "https://beatonma.org/webmentions_tester/"
Homepage = "https://beatonma.org/apps/django-wm/"
Source = "https://github.com/beatonma/django-wm"
Changelog = "https://github.com/beatonma/django-wm/CHANGELOG.md"
Download = "https://pypi.org/project/django-wm/"
Documentation = "https://github.com/beatonma/django-wm/wiki"
Issues = "https://github.com/beatonma/django-wm/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["mentions*"]

[tool.setuptools.dynamic]
version = { attr = "mentions.__version__" }

[tool.setuptools.package-data]
mentions = ["templates/mentions/*.html"]

[tool.isort]
profile = "black"
